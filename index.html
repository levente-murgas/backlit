<!doctype html>
<html lang="en" data-theme="dark" data-glass-appearance="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backlit</title>
<link rel="stylesheet" href="liquid-glass.css">
<script>
  // apply the saved theme before first paint
  try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = document.documentElement.dataset.glassAppearance = t; } catch {}
</script>
<style>
  :root { --glow: #ff4400; --base: #08080c; --text: #fff; --muted: rgb(255 255 255 / .62); --fill: rgb(120 120 128 / .26); --fill-hover: rgb(120 120 128 / .38); --accent: #0a84ff; --err: #ff6961; color-scheme: dark; }
  :root[data-theme="light"] { --base: #eceaf2; --text: #111113; --muted: rgb(17 17 19 / .6); --fill: rgb(120 120 128 / .16); --fill-hover: rgb(120 120 128 / .26); --err: #d70015; color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--base); color: var(--text); font: 15px/1.4 var(--lg-font); -webkit-font-smoothing: antialiased; }

  /* Scene: the backdrop is the "backlight" — it glows in the picked colour, and every glass panel refracts it */
  .lg-scene { position: relative; min-height: 100svh; overflow: hidden; }
  .lg-backdrop {
    position: absolute; inset: 0;
    background:
      radial-gradient(40% 30% at 18% 12%, var(--glow) 0, transparent 70%),
      radial-gradient(45% 35% at 85% 45%, color-mix(in oklab, var(--glow), #6a3dff 55%) 0, transparent 70%),
      radial-gradient(50% 30% at 30% 88%, color-mix(in oklab, var(--glow), #00c2ff 50%) 0, transparent 70%),
      repeating-linear-gradient(115deg, rgb(128 128 128 / .07) 0 2px, transparent 2px 26px),
      var(--base);
  }

  main { position: relative; max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; display: grid; gap: 18px; }
  header { display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 20px; border-radius: 999px; }
  h1 { font-size: 20px; font-weight: 700; letter-spacing: -.02em; margin: 0 auto 0 0; }
  section { border-radius: 28px; padding: 20px; display: grid; gap: 14px; }
  h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--lg-fg-2, var(--muted)); margin: 0; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  label { color: var(--lg-fg-2, var(--muted)); font-size: 14px; font-weight: 500; }
  .lg-slider { flex: 1; min-width: 140px; --lg-slider-fill: var(--glow); }
  .value { min-width: 40px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 500; color: var(--lg-fg-2, var(--muted)); }
  .icon { height: 22px; flex: none; fill: currentColor; color: var(--lg-fg-2, var(--muted)); }

  /* theme button shows the mode you'd switch to */
  #theme svg { width: 20px; height: 20px; fill: currentColor; }
  [data-theme="dark"] #theme .moon, [data-theme="light"] #theme .sun { display: none; }

  /* Controls inside glass are plain fills — no glass on glass */
  section button, section input[type=number], dialog button { min-height: 36px; padding: 8px 16px; border: 0; border-radius: 999px; background: var(--fill); color: inherit; font: 500 14px/1 var(--lg-font); cursor: pointer; }
  section button:hover, dialog button:hover { background: var(--fill-hover); }
  section button:focus-visible, section input:focus-visible, dialog button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); color: #fff; font-weight: 600; }
  button.primary:hover { background: color-mix(in oklab, var(--accent), #000 12%); }
  button.round { width: 36px; padding: 0; font-size: 20px; font-weight: 400; }
  section input[type=number] { width: 88px; cursor: text; }
  .effects { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .effects button.active { background: var(--glow); color: #fff; box-shadow: 0 0 18px -2px var(--glow); }
  .settings { display: grid; gap: 14px; padding-top: 14px; border-top: 1px solid var(--fill); }
  .settings.row { display: flex; }
  .settings[hidden] { display: none; }

  /* Colour wells as circles */
  input[type=color] { width: 40px; height: 40px; padding: 0; border: 0; border-radius: 50%; background: none; cursor: pointer; box-shadow: 0 0 0 2px rgb(255 255 255 / .5), 0 2px 10px rgb(0 0 0 / .2); }
  input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
  input[type=color]::-webkit-color-swatch { border: 0; border-radius: 50%; }
  input[type=color]::-moz-color-swatch { border: 0; border-radius: 50%; }
  #color { width: 52px; height: 52px; }

  #error { font-size: 13px; font-weight: 500; color: var(--err); text-align: center; }
  #error:empty { display: none; }
  #stopped { margin: 0; font-size: 13px; font-weight: 500; color: var(--muted); text-align: center; }

  /* Confirmation: a glass sheet in the top layer */
  dialog { padding: 0; border: 0; background: none; overflow: visible; color: var(--text); max-width: min(360px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgb(0 0 0 / .35); }
  dialog form { display: grid; gap: 12px; padding: 22px; border-radius: 28px; }
  dialog h3 { margin: 0; font-size: 17px; font-weight: 600; }
  dialog p { margin: 0; font-size: 14px; color: var(--lg-fg-2, var(--muted)); }
  dialog .row { justify-content: flex-end; margin-top: 4px; }
  dialog button.danger { background: #ff3b30; color: #fff; font-weight: 600; }
  dialog button.danger:hover { background: color-mix(in oklab, #ff3b30, #000 12%); }
</style>
</head>
<body class="lg-scene">
<div class="lg-backdrop"></div>
<main>
  <header class="glass">
    <h1>Backlit</h1>
    <button class="glass lg-button" data-glass-interactive id="quit">Stop app</button>
    <button class="glass lg-button lg-icon" data-glass-interactive id="theme" aria-label="Toggle light or dark mode">
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></g></svg>
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
    </button>
    <button class="glass lg-button" data-glass-interactive id="off">Turn off</button>
  </header>

  <section class="glass" data-glass-refraction="18" data-glass-bezel="20">
    <h2>Colour</h2>
    <div class="row">
      <input type="color" id="color" value="#ff4400" aria-label="Colour">
      <button class="primary" id="setColor">Set solid colour</button>
    </div>
    <div class="row">
      <label for="brightness">Brightness</label>
      <div class="lg-slider"><input type="range" id="brightness" min="0" max="100" value="100"></div>
      <span class="value" id="brightnessVal">100%</span>
    </div>
  </section>

  <section class="glass" data-glass-refraction="18" data-glass-bezel="20">
    <h2>Effects</h2>
    <div class="effects" id="effects"></div>
    <div class="settings row" id="speedSettings" hidden>
      <svg class="icon" width="30" viewBox="2.5 6 21 13" aria-hidden="true"><path d="M3 15a8 7.5 0 0 1 16 0z"/><circle cx="20.5" cy="13" r="2.3"/><rect x="5" y="15" width="3.2" height="3.5" rx="1.2"/><rect x="13.8" y="15" width="3.2" height="3.5" rx="1.2"/></svg>
      <div class="lg-slider"><input type="range" id="speed" min="0" max="100" value="50" aria-label="Speed"></div>
      <svg class="icon" width="22" viewBox="1.5 0.5 20 20" aria-hidden="true"><ellipse cx="11" cy="15.5" rx="7" ry="4.5"/><circle cx="17.5" cy="11.5" r="3"/><ellipse cx="16.2" cy="5.2" rx="1.3" ry="3.8" transform="rotate(-14 16.2 5.2)"/><ellipse cx="19.2" cy="5.6" rx="1.3" ry="3.8" transform="rotate(14 19.2 5.6)"/><circle cx="3.8" cy="13.5" r="1.6"/></svg>
    </div>
    <div class="settings" id="pulseSettings" hidden>
      <div class="row" id="pulseColors"></div>
      <div class="row">
        <button class="round" id="addColor" aria-label="Add colour">+</button>
        <button class="round" id="removeColor" aria-label="Remove last colour">−</button>
        <button id="rainbow">Rainbow</button>
      </div>
      <div class="row">
        <label for="period">Seconds per pulse</label>
        <input type="number" id="period" min="0.5" step="0.5" value="20">
      </div>
    </div>
    <div class="settings" id="cycleSettings" hidden>
      <div class="row">
        <label for="cycleSeconds">Seconds per full cycle</label>
        <input type="number" id="cycleSeconds" min="1" step="1" value="120">
      </div>
    </div>
  </section>

  <div id="error" role="alert"></div>
  <p id="stopped" hidden>Backlit stopped. Open it again from Raycast.</p>
</main>
<dialog id="quitDialog" aria-labelledby="quitTitle">
  <form method="dialog" class="glass" data-glass-refraction="18" data-glass-bezel="20">
    <h3 id="quitTitle">Stop Backlit?</h3>
    <p>The app shuts down. The strip keeps its current light, but Smart pulse and Color cycle freeze. Open it again from Raycast.</p>
    <div class="row">
      <button value="cancel" autofocus>Cancel</button>
      <button value="quit" class="danger">Stop app</button>
    </div>
  </form>
</dialog>
<script src="liquid-glass.js"></script>
<script>
const $ = id => document.getElementById(id);
const RAINBOW = ['#ff0000', '#ff8000', '#ffff00', '#00ff00', '#00ffff', '#0000ff', '#ff00ff'];
let solid = false; // last thing sent was a solid colour, so brightness changes re-send it

async function send(...args) {
  try {
    const r = await fetch('/api', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(args.map(String)) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error);
    $('error').textContent = '';
  } catch (e) { $('error').textContent = e.message; }
}
const hex = () => $('color').value.slice(1);
$('color').oninput = e => document.documentElement.style.setProperty('--glow', e.target.value);

$('theme').onclick = () => {
  const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = document.documentElement.dataset.glassAppearance = t;
  try { localStorage.setItem('theme', t); } catch {}
};

$('off').onclick = () => { solid = false; send('off'); };
$('quit').onclick = () => $('quitDialog').showModal();
$('quitDialog').onclose = async () => {
  if ($('quitDialog').returnValue !== 'quit') return;
  await send('quit');
  if (!$('error').textContent) $('stopped').hidden = false;
};
$('setColor').onclick = () => { solid = true; send('color', hex()); };

// Slider is 0–100 %; the strip takes 5 (its dimmest) to 255
$('brightness').oninput = e => $('brightnessVal').textContent = e.target.value + '%';
$('brightness').onchange = async e => {
  await send('brightness', Math.round(5 + e.target.value * 2.5));
  if (solid) send('color', hex());
};

// Firmware speed byte: higher = slower, and it ignores anything past 100. The slider runs slow → fast.
const speed = () => 100 - $('speed').value;
// Each effect shows its own settings panel (if any); Smart pulse and Color cycle are run by the server.
const EFFECTS = [
  { name: 'Rainbow', start: () => send('effect', 0, speed()) },
  { name: 'Carousel', panel: 'speedSettings', start: () => send('effect', 2, speed()) },
  { name: 'Smart pulse', panel: 'pulseSettings',
    start: () => send('pulse', [...$('pulseColors').children].map(c => c.value.slice(1)).join(','), $('period').value) },
  { name: 'Color cycle', panel: 'cycleSettings', start: () => send('cycle', $('cycleSeconds').value) },
];
let current = null;
EFFECTS.forEach(fx => {
  const b = document.createElement('button');
  b.textContent = fx.name;
  b.onclick = () => {
    solid = false; current = fx;
    document.querySelectorAll('#effects button').forEach(x => x.classList.toggle('active', x === b));
    document.querySelectorAll('.settings').forEach(p => p.hidden = p.id !== fx.panel);
    fx.start();
  };
  $('effects').append(b);
});
$('speed').onchange = () => send('speed', speed());
// settings changes apply straight away to the running effect
const restart = panel => { if (current?.panel === panel) current.start(); };
const deselect = () => {
  current = null;
  document.querySelectorAll('#effects button').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.settings').forEach(p => p.hidden = true);
};

$('off').addEventListener('click', deselect);
$('setColor').addEventListener('click', deselect);

function addPulseColor(value) {
  const c = document.createElement('input');
  c.type = 'color'; c.value = value; c.setAttribute('aria-label', 'Pulse colour');
  $('pulseColors').append(c);
}
function setPulseColors(list) { $('pulseColors').replaceChildren(); list.forEach(addPulseColor); }
setPulseColors(RAINBOW);
$('addColor').onclick = () => { addPulseColor($('color').value); restart('pulseSettings'); };
$('removeColor').onclick = () => { const p = $('pulseColors'); if (p.children.length > 1) { p.lastChild.remove(); restart('pulseSettings'); } };
$('rainbow').onclick = () => { setPulseColors(RAINBOW); restart('pulseSettings'); };
$('pulseColors').onchange = $('period').onchange = () => restart('pulseSettings');
$('cycleSeconds').onchange = () => restart('cycleSettings');
</script>
</body>
</html>
